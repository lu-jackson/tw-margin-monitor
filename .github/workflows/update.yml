name: update-and-deploy

# Idempotent: every run fetches only what is new, commits only if something changed,
# and redeploys the static site only when data changed (or on manual / push triggers).
# TWSE publishes margin data in the evening (Taipei); CBOE VIX closes ~05:15–06:15 Taipei next morning.
on:
  schedule:
    - cron: "*/10 13-16 * * 1-5"   # 21:00–00:50 Taipei: poll for TWSE margin + prices
    - cron: "*/30 21-23 * * 1-5"   # 05:00–07:50 Taipei (Tue–Sat): poll for the previous US session's VIX close
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/test_compute.py
      - name: Fetch new data and rebuild
        if: github.event_name != 'push'
        run: python pipeline/update.py
      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "margin-bot"
          git config user.email "margin-bot@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no change"; else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
